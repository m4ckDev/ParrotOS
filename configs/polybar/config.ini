[colors]
background = #e60b0b0d
background-alt = #1a1a1f
foreground = #f2f2f2
muted = #8a8a90
accent = #ff2b2b

[bar/main]
width = 100%
height = 30
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 2
border-size = 6
border-color = #00000000
padding-left = 1
padding-right = 2
module-margin = 1
font-0 = monospace:size=10;2
modules-left = xworkspaces xwindow
modules-right = cpu memory vpn date
wm-restack = i3
enable-ipc = true

[module/xworkspaces]
type = internal/xworkspaces
label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline = ${colors.accent}
label-active-padding = 1
label-occupied = %name%
label-occupied-padding = 1
label-empty = %name%
label-empty-foreground = ${colors.muted}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:50:...%

[module/cpu]
type = internal/cpu
interval = 2
label = CPU %percentage%%

[module/memory]
type = internal/memory
interval = 2
label = RAM %percentage_used%%

[module/vpn]
type = custom/script
interval = 5
exec = sh -c 'ip link show wg0 >/dev/null 2>&1 && printf "WG ON" || printf "WG OFF"'
format-foreground = ${colors.accent}

[module/date]
type = internal/date
interval = 1
date = %Y-%m-%d
time = %H:%M
label = %date% %time%
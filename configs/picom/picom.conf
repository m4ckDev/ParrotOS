backend = "glx";
vsync = true;
shadow = true;
shadow-radius = 18;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-opacity = 0.45;
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
corner-radius = 10;
inactive-opacity = 0.96;
active-opacity = 1.0;
frame-opacity = 1.0;
detect-rounded-corners = true;
detect-client-opacity = true;